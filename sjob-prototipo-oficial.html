<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sjob – Empleos en República Dominicana. Publicar es gratis. Pagas solo cuando contratas.">
<meta property="og:title" content="Sjob – Empleo y talento en RD">

<title>Sjob – Prototipo Oficial</title>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --base:#2a2825; --deep:#201e1c; --panel:#33302c; --gold:#e0a63e; --bone:#efe8da;
  --mute:#b3aa9a; --ok:#7fc58b; --bad:#e07a6a; --info:#6ab0e0; --google:#fff;
  color-scheme: dark;
}
[data-theme="light"] {
  --base:#f7f3eb; --deep:#efe8da; --panel:#fff; --gold:#c48a1a; --bone:#2a2825;
  --mute:#6b6358; --ok:#2e8b57; --bad:#c44a3a; --info:#2a6f9e; --google:#fff;
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--base);color:var(--bone);font:400 1rem/1.5 "Instrument Sans",system-ui,sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:"Familjen Grotesk",system-ui,sans-serif;margin:0;line-height:1.15}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:64rem;margin:0 auto;padding:0 1rem}
.top{background:var(--deep);border-bottom:1px solid #e0a63e44;position:sticky;top:0;z-index:20}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;padding-block:.6rem}
.brand{display:flex;align-items:center;gap:.5rem;font:700 1.2rem "Familjen Grotesk";cursor:pointer}
.brand img{width:38px;height:38px;border-radius:9px}
.roles{display:flex;gap:.3rem;background:var(--base);padding:.25rem;border-radius:12px}
button{font:inherit;cursor:pointer}
.roles button,.tabs button{background:none;border:0;color:var(--mute);padding:.55rem .9rem;border-radius:9px;font-weight:600;min-height:44px}
.roles button[aria-pressed=true],.tabs button[aria-pressed=true]{background:var(--gold);color:#1d1a15}
.tools{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--gold);border-radius:10px;padding:.55rem 1rem;font-weight:600;min-height:44px;background:var(--gold);color:#1d1a15}
.btn.line{background:none;color:var(--gold)}
.btn.bad{background:none;border-color:var(--bad);color:var(--bad)}
.btn.info{background:none;border-color:var(--info);color:var(--info)}
.btn.sm{padding:.35rem .8rem;min-height:38px;font-size:.92rem}
.btn.google{background:#fff;color:#3c4043;border:1px solid #dadce0;display:inline-flex;align-items:center;gap:.6rem;font-weight:500}
.btn.google svg{width:18px;height:18px;flex-shrink:0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:.3rem;margin:1rem 0;flex-wrap:wrap}
h2{font-size:1.5rem;margin:1.2rem 0 .6rem}
.card{background:var(--panel);border-left:4px solid var(--gold);border-radius:6px 14px 14px 6px;padding:1rem 1.1rem;margin:.7rem 0;position:relative}
.card h3{font-size:1.1rem}.card p{margin:.25rem 0;color:var(--mute)}
.card.boost{border-left-color:var(--info);box-shadow:0 0 0 1px #6ab0e033}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem;align-items:center}
.tag{display:inline-block;border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:.1rem .7rem;font-size:.85rem;font-weight:600}
.tag.ok{border-color:var(--ok);color:var(--ok)}.tag.bad{border-color:var(--bad);color:var(--bad)}.tag.info{border-color:var(--info);color:var(--info)}
label{display:block;font-weight:600;margin:.7rem 0 .25rem}
input,select,textarea{width:100%;font:inherit;color:var(--bone);background:var(--deep);border:1px solid #e0a63e66;border-radius:10px;padding:.65rem;min-height:46px}
.form{max-width:28rem}
.grid{display:grid;gap:.6rem}
@media(min-width:42rem){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:1fr 1fr 1fr}}
.note{background:var(--deep);border-radius:10px;padding:.7rem .9rem;color:var(--mute);font-size:.95rem;margin:.7rem 0}
dialog{border:1px solid var(--gold);border-radius:16px;background:var(--base);color:var(--bone);width:min(94vw,36rem);padding:1.1rem;max-height:86vh}
dialog::backdrop{background:#000b}
.msg{padding:.5rem .7rem;border-radius:10px;margin:.4rem 0;background:var(--panel);max-width:85%}
.msg.me{margin-left:auto;background:#4a3d22}[data-theme="light"] .msg.me{background:#f0e0b8}
.msg.sys{background:none;border:1px dashed var(--bad);color:var(--bad);max-width:100%;font-size:.9rem}
.msg small{display:block;color:var(--mute)}
.log{border-bottom:1px solid #fff2;padding:.5rem 0;font-size:.95rem}
summary{cursor:pointer;color:var(--gold);font-weight:600;margin-top:.5rem}
textarea{min-height:5rem;resize:vertical}
.hero{display:grid;gap:1.5rem;padding:1.5rem 0 1rem;align-items:center}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);max-width:17ch}
.lead{color:var(--mute);font-size:1.1rem;max-width:44ch}
.lg{width:min(100%,21rem);border-radius:22px;justify-self:center;border:1px solid #e0a63e55}
.sbar{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}
.sbar input{flex:1 1 12rem}.sbar select{flex:0 1 12rem}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin:1.2rem 0}
.stat{background:var(--deep);border-radius:12px;padding:.8rem 1rem}
.stat b{display:block;font:700 1.8rem "Familjen Grotesk";color:var(--gold)}
.stat span{color:var(--mute);font-size:.92rem}
.steps,.card ul{margin:.5rem 0 0;padding-left:1.2rem;color:var(--mute)}.steps li{margin:.35rem 0}
details.faq{background:var(--panel);border-radius:10px;padding:.8rem 1rem;margin:.5rem 0}
details.faq summary{margin:0}details.faq p{color:var(--mute);margin:.5rem 0 0}
.match{display:inline-flex;align-items:center;gap:.3rem;font-weight:700;color:var(--ok)}
.progress{height:8px;background:var(--deep);border-radius:99px;overflow:hidden;margin:.4rem 0}
.progress span{display:block;height:100%;background:var(--gold);border-radius:99px}
.badge{display:inline-block;background:var(--gold);color:#1d1a15;font-size:.75rem;font-weight:700;padding:.15rem .5rem;border-radius:6px;margin-left:.3rem}
.fav{position:absolute;top:.8rem;right:.9rem;background:none;border:0;font-size:1.3rem;color:var(--mute);padding:.2rem;line-height:1}
.fav.on{color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--deep);border-radius:99px;padding:.25rem .7rem;font-size:.85rem;margin:.2rem}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);padding:.7rem 1.2rem;border-radius:12px;z-index:50;box-shadow:0 8px 24px #0005;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateX(-50%) translateY(10px)}}
.legal{max-width:40rem;margin:1rem auto;line-height:1.6;color:var(--mute)}
.legal h3{color:var(--bone);margin:1.2rem 0 .4rem}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
.g-user{display:flex;align-items:center;gap:.5rem;font-size:.9rem;color:var(--mute)}
.role-pick{display:grid;gap:1rem;max-width:32rem;margin:1.5rem auto}
.role-pick .card{cursor:pointer;transition:border-color .15s}
.role-pick .card:hover{border-left-color:var(--ok)}
@media(min-width:42rem){.hero{grid-template-columns:1.2fr .8fr}.stats{grid-template-columns:repeat(4,1fr)}}
.theme-btn{background:none;border:1px solid var(--mute);color:var(--mute);border-radius:8px;padding:.4rem .7rem;min-height:38px}
</style>
</head>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function id(){return S.n++}
function by(l,i){return S[l].filter(function(x){return x.id===i})[0]}
function rd(n){return 'RD$ '+Number(n).toLocaleString('es-DO')}
function dt(s){return new Date(s).toLocaleString('es-DO',{dateStyle:'medium',timeStyle:'short'})}
function notify(to,msg){['Correo','WhatsApp'].forEach(function(ch){S.notes.unshift({to:to,ch:ch,msg:msg,t:new Date().toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'})})})}
function opts(a,v){return a.map(function(x){return'<option'+(x===v?' selected':'')+'>'+x+'</option>'}).join('')}
function bt(t,a,d,c){return'<button class="btn sm '+(c||'')+'" data-a="'+a+'" '+(d||'')+'>'+t+'</button>'}
function fee(){return S.usd||20}
function usd(n){return'US$ '+Number(n).toFixed(2)}
function ago(t){if(!t)return'';var x=Math.floor((Date.now()-t)/36e5);if(x<1)return'hace minutos';if(x<24)return'hace '+x+' h';var d=Math.floor(x/24);return d===1?'hace un día':'hace '+d+' días'}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2800)}
function charge(a){var j=by('jobs',a.job);var amt=fee();S.pays.unshift({id:id(),app:a.id,co:j.co,kind:'hire',amt:amt,t:new Date().toLocaleString('es-DO')});a.status='started';
 notify(by('cos',j.co).name,'Se cobró la comisión de '+usd(amt)+' a la tarjeta •••• 4242 por la contratación de '+by('cands',a.cand).name+'.');
 notify(by('cands',a.cand).name,'Tu empleo en '+by('cos',j.co).name+' quedó confirmado. ¡Éxitos!')}
function mask(t){var hit=0;function r(x){hit=1;return x}
 t=t.replace(/[\w.+-]+@[\w-]+\.[\w.]+/g,function(m){return r('[correo oculto]')}).replace(/https?:\/\/\S+|www\.\S+/gi,function(m){return r('[enlace oculto]')})
 .replace(/(\+?\d[\s\-.()]*){7,}/g,function(m){return r('[número oculto]')})
 .replace(/((cero|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve)[\s,.\-]+){4,}(cero|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve)/gi,function(m){return r('[número oculto]')})
 .replace(/guasap|wasap|whatsapp|telegram|instagram|arroba/gi,function(m){return r('[contacto oculto]')});return{t:t,hit:hit}}

function field(l,n,t,ex){return'<label for="'+n+'">'+l+'</label><input id="'+n+'" name="'+n+'" type="'+(t||'text')+'" required '+(ex||'')+'>'}
function matchScore(c,j){
  if(!c||!j)return 0;
  var s=40;
  if(c.cat===j.cat)s+=25;
  if(c.city===j.city)s+=15;
  if(c.ced==='ok')s+=10;
  if(c.cv)s+=5;
  if(c.avail)s+=5;
  return Math.min(98,s+Math.floor(Math.random()*8));
}
function profilePct(c){
  var n=0,t=6;
  if(c.name)n++;if(c.email||c.phone)n++;if(c.city)n++;if(c.cat)n++;if(c.cv||c.cvtxt)n++;if(c.ced==='ok')n++;
  return Math.round(n/t*100);
}
function isFav(jid){return S.favs.indexOf(jid)>-1}
function gBtn(label){return'<button class="btn google" data-a="google"><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>'+(label||'Continuar con Google')+'</button>'}

function jobCard(j,showMatch){
  var ap=S.me.c&&S.apps.some(function(a){return a.job===j.id&&a.cand===S.me.c});
  var co=by('cos',j.co);
  var ms=showMatch&&S.me.c?matchScore(by('cands',S.me.c),j):0;
  var favBtn=S.me.c?'<button class="fav '+(isFav(j.id)?'on':'')+'" data-a="fav" data-id="'+j.id+'" title="Guardar">★</button>':'';
  return'<div class="card'+(j.boost?' boost':'')+'">'+favBtn+'<h3>'+esc(j.title)+(j.boost?' <span class="badge">Destacada</span>':'')+'</h3>'+
  '<p>'+esc(co?co.name:'')+' · '+j.city+' · '+j.mode+' · '+(j.jornada||'Tiempo completo')+' · '+j.cat+'</p>'+
  '<p><b style="color:var(--bone)">'+rd(j.sal)+'</b> al mes · '+ago(j.t)+(co&&co.fast?' · <span class="tag info">Responde rápido</span>':'')+'</p>'+
  (ms?'<p class="match">Match '+ms+'%</p><div class="progress"><span style="width:'+ms+'%"></span></div>':'')+
  (j.desc||j.req?'<details><summary>Ver detalle</summary>'+(j.desc?'<p>'+esc(j.desc)+'</p>':'')+(j.req?'<p><b>Requisitos:</b> '+esc(j.req)+'</p>':'')+(j.q1?'<p><b>Pregunta filtro:</b> '+esc(j.q1)+'</p>':'')+'</details>':'')+
  '<div class="acts">'+(ap?'<span class="tag ok">Ya te postulaste</span>':bt('Postularme con 1 clic','apply','data-id="'+j.id+'"'))+
  bt('Compartir','share','data-id="'+j.id+'"','line')+'</div></div>';
}

      '<div class="role-pick">'+

      '</div>'+bt('Cancelar','home','','line');

      '<form class="form" data-f="loginad">'+field('Contraseña','pw','password')+'<div class="acts"><button class="btn">Entrar</button>'+bt('Volver','home','','line')+'</div></form>';

    '<div class="acts" style="margin:1.5rem 0">'+gBtn()+'</div>'+
    '<div class="note">Al continuar aceptas los Términos y la Política de Privacidad (Ley 172-13).</div>'+
    '<div class="card"><h3>¿Qué ocurre después?</h3><ol class="steps"><li>Google comparte tu correo, nombre y foto (verificados).</li><li>Eliges si eres candidato o empresa.</li><li>Si eres empresa, ingresas el RNC para validación.</li></ol></div>'+

function render(){
  if(page==='app'&&!(role==='c'?S.me.c:role==='o'?S.me.o:S.me.a)){page='auth';authStep=null}
  var r=[];if(S.me.c)r.push(['c','Candidato']);if(S.me.o)r.push(['o','Empresa']);if(S.me.a)r.push(['a','Admin']);
  var gInfo='';
  if(S.me.g){var u=S.users.filter(function(x){return x.email===S.me.g})[0];if(u)gInfo='<span class="g-user"><img class="avatar" src="'+esc(u.picture)+'" alt="">'+esc(u.name.split(' ')[0])+'</span>'}
  $('roles').innerHTML=r.length?gInfo+r.map(function(x){return'<button data-a="role" data-v="'+x[0]+'" aria-pressed="'+(page==='app'&&role===x[0])+'">'+x[1]+'</button>'}).join('')+(page==='app'?'<button data-a="logout">Salir</button>':''):gBtn('Entrar con Google');
  $('nb').textContent='Avisos ('+S.notes.length+')';
  document.documentElement.setAttribute('data-theme',S.theme||'dark');
  $('app').innerHTML=page==='home'?vHome():page==='jobs'?'<h2>Vacantes en República Dominicana</h2>'+jobsBlock():page==='auth'?vAuth():role==='c'?vCand():role==='o'?vCo():vAd();
  save();if(lastP!==page+role+(authStep||'')){lastP=page+role+(authStep||'');window.scrollTo(0,0)}
}

    '<div style="max-height:40vh;overflow:auto">'+(a.chat&&a.chat.length?a.chat.map(function(m){return'<div class="msg '+(m.w==='s'?'sys':m.w===me?'me':'')+'">'+(m.w==='s'?'':'<small>'+(m.w==='c'?'Candidato':'Empresa')+'</small>')+esc(m.t)+'</div>'}).join(''):'<p style="color:var(--mute)">Aún no hay mensajes.</p>')+'</div>'+
